[VR]
Enabled=1

[Diagnostic]
HighResolutionProbe=0

[Features]
Input=1
OpticalHandTracking=1
Hands=1
StartupMenuUI=1
Haptics=1
HapticStrengthPercent=65
StickDeadzonePercent=30
HorizontalTurnSpeed=36
VerticalStickLook=1
VerticalTurnSpeed=28

[Bindings.Quest]
; Quest 3 defaults — keep these values to retain the standard Quest layout.
; Valid values: none, left/right_primary (A), left/right_secondary (B),
; left/right_stick_click, left/right_grip, left/right_trigger, left_menu,
; left_trackpad_click, and left_system.
Menu=left_menu
Sprint=left_stick_click
Crouch=right_stick_click
Jump=right_primary
Use=right_secondary
Context=right_secondary
HotbarPrevious=left_primary
HotbarNext=left_secondary
Inventory=left_secondary

[Bindings.SteamVR]
; SteamVR/Valve Index defaults avoid the Steam dashboard system button and
; avoid thumbstick-click sprint, which can be confused with turning.
Menu=left_trackpad_click
Sprint=left_grip
Crouch=right_stick_click
Jump=right_primary
Use=right_secondary
Context=right_secondary
HotbarPrevious=left_primary
HotbarNext=left_secondary
Inventory=left_secondary
